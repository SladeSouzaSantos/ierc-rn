name: Security checks
on:
  push:
    branches: [dev, main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'cms/package.json'
      - 'cms/package-lock.json'
      - 'curator/package.json'
      - 'curator/package-lock.json'
      - 'scripts/security-static-check.mjs'
      - 'scripts/tests/security-static-check.test.mjs'
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-and-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'cms', 'curator']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check repository for accidentally committed secrets
        run: |
          node --test scripts/tests/security-static-check.test.mjs
          node scripts/security-static-check.mjs
      - name: Verify committed lockfile without running install scripts
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail on published critical production dependency advisories
        working-directory: ${{ matrix.directory }}
        run: npm audit --omit=dev --audit-level=critical

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
