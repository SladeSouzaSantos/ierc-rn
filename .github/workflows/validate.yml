name: Validate DEV portal

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build-and-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: CMS schema and editorial safety contract
        run: node --test cms/tests/schema.test.cjs
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: E2E, keyboard and axe checks
        run: npm run test:e2e
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  cms-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ierc_cms_ci
          POSTGRES_USER: ierc_cms_ci
          POSTGRES_PASSWORD: ci-secret-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ierc_cms_ci -d ierc_cms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated CMS dependencies
        run: npm install --prefix cms --no-audit --no-fund
      - name: Build Strapi editorial admin
        run: npm run --prefix cms build
        env:
          APP_KEYS: ci-key-1,ci-key-2,ci-key-3,ci-key-4
          ADMIN_JWT_SECRET: ci-admin-jwt-only
          API_TOKEN_SALT: ci-api-token-salt-only
          ENCRYPTION_KEY: 2f8a4b63eb7f4bbfa0674f63582d761b9b21292f4f38776fc7b8284939aedd85
          TRANSFER_TOKEN_SALT: ci-transfer-only
          JWT_SECRET: ci-jwt-only
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: ierc_cms_ci
          DATABASE_USERNAME: ierc_cms_ci
          DATABASE_PASSWORD: ci-secret-only

      - name: Run Strapi with PostgreSQL and verify private API
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 1337
          APP_KEYS: ci-key-1,ci-key-2,ci-key-3,ci-key-4
          ADMIN_JWT_SECRET: ci-admin-jwt-only
          API_TOKEN_SALT: ci-api-token-salt-only
          ENCRYPTION_KEY: 2f8a4b63eb7f4bbfa0674f63582d761b9b21292f4f38776fc7b8284939aedd85
          TRANSFER_TOKEN_SALT: ci-transfer-only
          JWT_SECRET: ci-jwt-only
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_NAME: ierc_cms_ci
          DATABASE_USERNAME: ierc_cms_ci
          DATABASE_PASSWORD: ci-secret-only
          DATABASE_SSL: false
        run: |
          set -euo pipefail
          npm run --prefix cms start > /tmp/ierc-strapi-smoke.log 2>&1 &
          PID=$!
          cleanup() {
            CODE=$?
            if [ "$CODE" -ne 0 ]; then tail -100 /tmp/ierc-strapi-smoke.log || true; fi
            kill "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for ATTEMPT in $(seq 1 90); do
            if curl --max-time 3 -fsS http://127.0.0.1:1337/_health > /dev/null; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          [ "$READY" -eq 1 ]
          # Sem token ou contas criadas, a API editorial deve recusar consulta pública.
          HTTP_CODE=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:1337/api/news-articles)
          [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "401" ]
          echo "CMS health OK; anonymous news API denied ($HTTP_CODE)."
