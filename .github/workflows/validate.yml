name: Validate DEV portal

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build-and-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: CMS schema and editorial safety contract
        run: node --test cms/tests/schema.test.cjs
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: E2E, keyboard and axe checks
        run: npm run test:e2e
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  cms-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated CMS dependencies
        run: npm install --prefix cms --no-audit --no-fund
      - name: Build Strapi editorial admin
        run: npm run --prefix cms build
        env:
          APP_KEYS: ci-key-1,ci-key-2,ci-key-3,ci-key-4
          ADMIN_JWT_SECRET: ci-admin-jwt-only
          API_TOKEN_SALT: ci-api-token-salt-only
          TRANSFER_TOKEN_SALT: ci-transfer-only
          JWT_SECRET: ci-jwt-only
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: ierc_cms_ci
          DATABASE_USERNAME: ierc_cms_ci
          DATABASE_PASSWORD: ci-secret-only
