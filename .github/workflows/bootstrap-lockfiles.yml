name: Temporary DEV lockfile bootstrap
# This one-shot workflow is REMOVED after generating the reviewed lockfiles.
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/bootstrap-lockfiles.yml
permissions:
  contents: write
jobs:
  lockfiles:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce lockfiles without executing dependency scripts
        run: |
          set -euo pipefail
          for directory in . cms curator; do
            (cd "$directory" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          done
          test -s package-lock.json
          test -s cms/package-lock.json
          test -s curator/package-lock.json
          node -e "for(const dir of ['.','cms','curator']){const p=require('./'+dir+'/package.json');const l=require('./'+dir+'/package-lock.json');if(l.lockfileVersion<3)throw Error('old lock');if(l.packages[''].name!==p.name)throw Error('name mismatch');}"
      - name: Commit reproducible lockfiles to DEV
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json cms/package-lock.json curator/package-lock.json
          git diff --cached --quiet || {
            git commit -m "build(security): generate dependency lockfiles with npm"
            git push origin HEAD:dev
          }
