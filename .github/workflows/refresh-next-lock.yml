name: Temporary Next.js lockfile refresh
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/refresh-next-lock.yml']
permissions:
  contents: write
jobs:
  root-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without lifecycle scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.dependencies.next!=='15.5.29'||l.packages['node_modules/next'].version!=='15.5.29')throw Error('Patch not locked')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || {
            git commit -m "build(security): lock Next.js 15.5.29 and patched dependencies"
            git push origin HEAD:dev
          }
