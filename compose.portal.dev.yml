# DEV portal, independent of Strapi/monitor and never exposed beyond host loopback.
# Start the DEV CMS Compose first to create network ierc-rn-dev-cms-read.
name: ierc-rn-portal-dev
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
      args:
        SITE_URL: https://dev.iercrn.org.br
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: https://dev.iercrn.org.br
      CMS_ENABLED: ${CMS_ENABLED:-false}
      CMS_API_URL: http://cms:1337
      CMS_READ_TOKEN: ${CMS_READ_TOKEN:-}
    ports:
      - "127.0.0.1:3101:3000"
    networks:
      cms_read: {}
      edge:
        aliases: [ierc-rn-dev-portal]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 4
networks:
  cms_read:
    external: true
    name: ierc-rn-dev-cms-read

  edge:
    external: true
    name: ierc-rn-dev-edge
