# MAIN — https://iercrn.org.br
# cloudflared (host network) -> 127.0.0.1:18081 -> this Nginx -> private portal.
server {
    listen 8080;
    server_name iercrn.org.br;

    client_max_body_size 4m;

    location / {
        # Using a variable and Docker DNS avoids stale container IPs after redeploy.
        set $ierc_main_upstream "ierc-rn-main-portal:3000";
        proxy_pass http://$ierc_main_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
