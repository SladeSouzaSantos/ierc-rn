# DEV — https://dev.iercrn.org.br
# Protect this published hostname with Cloudflare Access before adding a tunnel route.
server {
    listen 8080;
    server_name dev.iercrn.org.br;

    client_max_body_size 4m;

    location / {
        set $ierc_dev_upstream "ierc-rn-dev-portal:3000";
        proxy_pass http://$ierc_dev_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
