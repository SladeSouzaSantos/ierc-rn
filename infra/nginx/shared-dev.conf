# IERC-RN DEV — /opt/projects/ierc-rn-dev/nginx.conf (generated locally).
# Published DEV hostname MUST be restricted by Cloudflare Access.
# Existing cloudflared -> existing nginx-proxy port 80 -> DEV portal.
server {
    listen 80;
    server_name dev.iercrn.org.br;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $ierc_upstream ierc-rn-dev-portal:3000;

    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://$ierc_upstream;
    }
}
