# FUTURE PROD portal; do not start until approved PR merge and launch gates.
# Separate container, host port, CMS network and credentials.
name: ierc-rn-portal-prod
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
      args:
        SITE_URL: https://iercrn.org.br
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: https://iercrn.org.br
      CMS_ENABLED: ${CMS_ENABLED:-false}
      CMS_API_URL: http://cms:1337
      CMS_READ_TOKEN: ${CMS_READ_TOKEN:-}
    ports:
      - "127.0.0.1:3102:3000"
    networks: [cms_read]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 4
networks:
  cms_read:
    external: true
    name: ierc-rn-prod-cms-read
