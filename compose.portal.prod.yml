# FUTURE PROD portal; do not start until approved PR merge and launch gates.
# Separate container, host port, CMS network and credentials.
name: ierc-rn-portal-prod
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
      args:
        SITE_URL: https://iercrn.org.br
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: https://iercrn.org.br
      CMS_ENABLED: ${CMS_ENABLED:-false}
      CMS_API_URL: http://cms:1337
      CMS_READ_TOKEN: ${CMS_READ_TOKEN:-}
      # Server-only monthly donation checkout; fail-closed unless verified.
      IERCRN_DONATIONS_RECURRING_ENABLED: ${IERCRN_DONATIONS_RECURRING_ENABLED:-false}
      IERCRN_DONATIONS_RECEIVER_VERIFIED: ${IERCRN_DONATIONS_RECEIVER_VERIFIED:-false}
      IERCRN_DONATIONS_GATEWAY: ${IERCRN_DONATIONS_GATEWAY:-}
      IERCRN_DONATIONS_RECEIVER_CNPJ: ${IERCRN_DONATIONS_RECEIVER_CNPJ:-}
      IERCRN_DONATIONS_HOSTED_LINKS_JSON: ${IERCRN_DONATIONS_HOSTED_LINKS_JSON:-}
    ports:
      - "127.0.0.1:3102:3000"
    networks:
      cms_read: {}
      proxy:
        aliases: [ierc-rn-main-portal]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 4
networks:
  cms_read:
    external: true
    name: ierc-rn-prod-cms-read

  # Reuse nginx-proxy's EXISTING external Docker network; no second Nginx.
  # Override IERC_PROXY_NETWORK only after verifying nginx-proxy's network.
  proxy:
    external: true
    name: ${IERC_PROXY_NETWORK:-nginx_default}
