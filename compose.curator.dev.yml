# Only a DEV deployment. Requires existing compose.cms.yml and its network.
# No service is automatically started during git pull or CMS upgrades.
name: ierc-rn-curator-dev
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [curator]
    command: ["redis-server","--appendonly","yes","--maxmemory-policy","noeviction"]
    volumes:
      - curator_redis:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [worker_private]
  worker:
    build: {context: ./curator, dockerfile: Dockerfile}
    # Persistent schedule only after explicit local env opt-in and smoke test.
    command: ["node","src/cli.mjs","schedule"]
    init: true
    restart: unless-stopped
    profiles: [curator]
    env_file: ./curator/.env
    depends_on:
      redis: {condition: service_healthy}
    networks: [worker_private,cms_dev_private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    # No public ports or credentials in the image.
networks:
  worker_private: {}
  cms_dev_private:
    external: true
    name: ierc-rn-cms_cms_private
volumes:
  curator_redis: {}
